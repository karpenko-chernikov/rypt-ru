{% extends "editor/base.html" %}
{% block title %}Фото{% endblock %}
{% block content %}
<p class="editor-back"><a href="{% url 'editor:season_photos' page.year %}">← Фото</a></p>
<h1 class="editor-h1">Добавить фото</h1>
<form method="post" class="editor-form" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {{ field.errors }}
    {% endfor %}
    <p style="margin-top:1.2rem"><button type="submit" class="editor-btn editor-btn-primary">Сохранить</button></p>
</form>
{% endblock %}
