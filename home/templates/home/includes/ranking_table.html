<table class="ranking">
    <thead>
        <tr>
            <th>Место</th>
            <th>Команда</th>
            {% if has_city %}<th>Город</th>{% endif %}
            {% if has_points %}<th>{{ points_label|default:"Сумма" }}</th>{% endif %}
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.place }}</td>
            <td>{{ row.team }}</td>
            {% if has_city %}<td>{{ row.city }}</td>{% endif %}
            {% if has_points %}<td>{{ row.points }}</td>{% endif %}
        </tr>
        {% endfor %}
    </tbody>
</table>
