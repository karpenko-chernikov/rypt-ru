{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}material-page{% endblock %}

{% block content %}
<article class="page">
    <h1>{{ page.title }}</h1>
    <div class="prose">{{ page.body|richtext }}</div>
    {% if page.get_parent %}
        <p class="back"><a href="{% pageurl page.get_parent %}">К разделу «{{ page.get_parent.title }}»</a></p>
    {% endif %}
</article>
{% endblock %}
