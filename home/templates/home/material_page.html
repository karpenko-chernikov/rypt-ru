{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}material-page{% endblock %}

{% block content %}
<article class="page page-material">
    <p class="back"><a href="{% pageurl page.get_parent %}">← {{ page.get_parent.title }}</a></p>
    <h1>{{ page.title }}</h1>
    <div class="prose prose-material">{{ page.body|richtext }}</div>
</article>
{% endblock %}
