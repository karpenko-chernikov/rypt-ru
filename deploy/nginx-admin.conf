# admin.rosypt.ru -> Wagtail /redaktura/ (redirect).
# Ставится в /etc/nginx/sites-available/admin и включается через sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name admin.rosypt.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://admin.rosypt.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.rosypt.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.rosypt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.rosypt.ru/privkey.pem;

    return 301 https://rosypt.ru/redaktura/;
}
