# Порт 80 — только ACME-челлендж и канонический HTTPS-редирект.
# Хост в редиректе фиксирован, чтобы не отражать клиентский Host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rypt.folomin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://rypt.folomin.com$request_uri;
    }
}

# Неизвестный Host/SNI на 443 — отбросить до Django (return 444).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/rypt.folomin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rypt.folomin.com/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rypt.folomin.com;

    ssl_certificate /etc/letsencrypt/live/rypt.folomin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rypt.folomin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 24M;

    location /static/ {
        alias /srv/rypt/current/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /srv/rypt/current/static/img/favicon.ico;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Файлы Wagtail-документов раздаются только через /documents/… (serve_view
    # проверяет приватность коллекции). Сырой путь /media/documents/ закрыт.
    location ^~ /media/documents/ {
        deny all;
    }

    location /media/ {
        alias /var/lib/rypt/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location /documents/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host rypt.folomin.com;
        proxy_set_header X-Forwarded-Host rypt.folomin.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store";
        expires -1;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Канонический Host и затирание клиентского X-Forwarded-Host,
        # чтобы подмена Host/X-Forwarded-Host не влияла на get_host() и ссылки.
        proxy_set_header Host rypt.folomin.com;
        proxy_set_header X-Forwarded-Host rypt.folomin.com;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем, а не дописываем: клиентский X-Forwarded-For
        # не должен влиять на определение IP клиента в Django.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
}
