server {
    listen 80;
    listen [::]:80;
    server_name rypt.folomin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rypt.folomin.com;

    ssl_certificate /etc/letsencrypt/live/rypt.folomin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rypt.folomin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 24M;

    location /static/ {
        alias /var/www/rypt/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /var/www/rypt/static/img/favicon.ico;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/rypt/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
}
